<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HOMIEWOOD - Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/home.css" />
    <link rel="stylesheet" href="../css/navbarSearch.css">
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar-root"></div>

    <!-- MAIN -->
    <div class="main-row">

        <!-- FEED -->
        <div class="feed-col">

            <!-- COMPOSER -->
            <div class="composer" id="composer">
                <button class="composer-collapsed-trigger" id="composerTrigger" aria-expanded="false">
                    <div class="user-icon">🎥</div>
                    <span>¿Qué estás viendo hoy?</span>
                </button>

                <div class="composer-body" id="composerBody" aria-hidden="true">
                    <p class="composer-label">1. Elige una película o serie</p>

                    <div class="film-search-wrap" id="filmSearchWrap">
                        <input type="text" id="filmSearchInput" placeholder="🎬 Buscar película o serie..."
                            autocomplete="off">
                        <div class="film-dropdown" id="filmDropdown"></div>
                    </div>

                    <div class="selected-film" id="selectedFilm">
                        <div class="mini-cover" id="selectedCover"></div>
                        <div class="selected-film-info">
                            <div id="selectedTitle" class="selected-title"></div>
                            <div id="selectedMeta" class="selected-meta"></div>
                            <div class="chip-tags" id="selectedTags"></div>
                        </div>
                        <button class="remove-film" id="removeFilm" title="Quitar">✕</button>
                    </div>

                    <div class="composer-rating" id="composerRatingWrap">
                        <p class="composer-label">2. ¿Cuánto le das?</p>
                        <div class="composer-star-rating" id="composerStars" role="group"
                            aria-label="Valoración de 1 a 5 estrellas">
                            <button type="button" class="star-btn" data-value="1" aria-label="1 estrella"><i
                                    class="bi bi-star"></i></button>
                            <button type="button" class="star-btn" data-value="2" aria-label="2 estrellas"><i
                                    class="bi bi-star"></i></button>
                            <button type="button" class="star-btn" data-value="3" aria-label="3 estrellas"><i
                                    class="bi bi-star"></i></button>
                            <button type="button" class="star-btn" data-value="4" aria-label="4 estrellas"><i
                                    class="bi bi-star"></i></button>
                            <button type="button" class="star-btn" data-value="5" aria-label="5 estrellas"><i
                                    class="bi bi-star"></i></button>
                        </div>
                        <span class="composer-rating-value" id="composerRatingValue"></span>
                    </div>

                    <p class="composer-label">3. ¿Qué quieres compartir?</p>

                    <textarea id="postText" placeholder="Cuéntale a tus homies..." class="mb-3"></textarea>

                    <div class="composer-actions">
                        <button class="post-submit-btn" id="postBtn" disabled>Postear</button>
                    </div>
                </div>
            </div>

            <!-- POSTS -->
            <div id="feed"></div>
        </div>

        <!-- SIDEBAR DESKTOP -->
        <aside class="sidebar-col" id="sidebarDesktop" aria-label="Recomendaciones">
            <div class="sidebar">

                <div class="sidebar-header">
                    <span>RECOMENDACIONES PARA TI</span>
                    <button class="btn-ver-todas" onclick="window.location.href='./recommendations.html'">
                        Ver todas
                    </button>
                </div>

                <div class="row g-2 mb-3" id="recommendationsGrid">
                    <p class="recommendations-loading">Cargando recomendaciones...</p>
                </div>

                <div class="sidebar-header">
                    <span>CARTELERA</span>
                    <button class="btn-ver-todas"
                        onclick="window.location.href='./recommendations.html?section=lanzamientos'">
                        Ver todas
                    </button>
                </div>

                <div class="row g-2">
                    <div class="col-4">
                        <div class="cover c5 cover-clickable" data-title="Devil Wears Prada 2"
                            data-director="David Frankel" data-year="2025" data-tags="Película,Drama"
                            data-cast="Meryl Streep, Anne Hathaway, Emily Blunt"
                            data-desc="La secuela esperada del clásico de moda."
                            data-grad="linear-gradient(135deg,#1a0050,#c050a0)">
                            <img src="https://m.media-amazon.com/images/M/MV5BZmM3ZDU3ODItZmY5Yi00OTQ2LWE5OTctZTA5NDBhMWJkOGY3XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg"
                                alt="Devil Wears Prada 2" width="80px">
                        </div>
                    </div>

                    <div class="col-4">
                        <div class="cover c6 cover-clickable" data-title="Michael" data-director="Antoine Fuqua"
                            data-year="2025" data-tags="Película,Drama"
                            data-cast="Jaafar Jackson, Nia Long, Colman Domingo"
                            data-desc="Biopic sobre la vida del rey del pop Michael Jackson."
                            data-grad="linear-gradient(135deg,#0a0a0a,#1a1a3a)">
                            <img src="https://m.media-amazon.com/images/M/MV5BNzllNmRlN2EtMDQyOC00ODJjLTg4OWQtZDNmNGU3YzlkNjc1XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg"
                                alt="Michael" width="80px">
                        </div>
                    </div>

                    <div class="col-4">
                        <div class="cover c7 cover-clickable" data-title="Toy Story 5" data-director="Andrew Stanton"
                            data-year="2026" data-tags="Película,Aventura" data-cast="Tom Hanks, Tim Allen, Annie Potts"
                            data-desc="Woody, Buzz y el resto de los juguetes regresan."
                            data-grad="linear-gradient(135deg,#000820,#1a4080)">
                            <img src="https://m.media-amazon.com/images/M/MV5BZTI1YTBiNmEtYWUxZi00YzFkLWIzNjMtMmZjMmY2NzM0ZWMzXkEyXkFqcGc@._V1_.jpg"
                                alt="Toy Story 5" width="80px">
                        </div>
                    </div>
                </div>

            </div>
        </aside>
    </div>

    <!-- SIDEBAR MÓVIL -->
    <div class="sidebar-drawer" id="sidebarDrawer" aria-hidden="true">
        <div class="sidebar-drawer-inner">

            <button class="sidebar-drawer-close" id="sidebarDrawerClose" aria-label="Cerrar recomendaciones">
                <i class="bi bi-x-lg"></i>
            </button>

            <div class="sidebar-header">
                <span>RECOMENDACIONES PARA TI</span>
                <a href="./recommendations.html">Ver todas</a>
            </div>

            <div class="row g-2 mb-3" id="recommendationsGridMobile">
                <p class="recommendations-loading">Cargando recomendaciones...</p>
            </div>

            <div class="sidebar-header">
                <span>CARTELERA</span>
                <a href="./recommendations.html?section=lanzamientos">Ver todas</a>
            </div>

            <div class="row g-2">
                <div class="col-4">
                    <div class="cover c5 cover-clickable" data-title="Devil Wears Prada 2" data-director="David Frankel"
                        data-year="2025" data-tags="Película,Drama" data-cast="Meryl Streep, Anne Hathaway, Emily Blunt"
                        data-desc="Miranda Priestly regresa con nuevos desafíos."
                        data-grad="linear-gradient(135deg,#1a0050,#c050a0)">
                        <img src="https://m.media-amazon.com/images/M/MV5BZmM3ZDU3ODItZmY5Yi00OTQ2LWE5OTctZTA5NDBhMWJkOGY3XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg"
                            alt="Devil Wears Prada 2" width="80px">
                    </div>
                </div>

                <div class="col-4">
                    <div class="cover c6 cover-clickable" data-title="Michael" data-director="Antoine Fuqua"
                        data-year="2025" data-tags="Película,Drama" data-cast="Jaafar Jackson, Nia Long, Colman Domingo"
                        data-desc="Biopic sobre la vida de Michael Jackson."
                        data-grad="linear-gradient(135deg,#0a0a0a,#1a1a3a)">
                        <img src="https://m.media-amazon.com/images/M/MV5BNzllNmRlN2EtMDQyOC00ODJjLTg4OWQtZDNmNGU3YzlkNjc1XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg"
                            alt="Michael" width="80px">
                    </div>
                </div>

                <div class="col-4">
                    <div class="cover c7 cover-clickable" data-title="Toy Story 5" data-director="Andrew Stanton"
                        data-year="2026" data-tags="Película,Aventura" data-cast="Tom Hanks, Tim Allen, Annie Potts"
                        data-desc="Woody y Buzz regresan en una nueva aventura."
                        data-grad="linear-gradient(135deg,#000820,#1a4080)">
                        <img src="https://m.media-amazon.com/images/M/MV5BZTI1YTBiNmEtYWUxZi00YzFkLWIzNjMtMmZjMmY2NzM0ZWMzXkEyXkFqcGc@._V1_.jpg"
                            alt="Toy Story 5" width="80px">
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="sidebar-drawer-overlay" id="sidebarDrawerOverlay"></div>

    <!-- MODAL DE PELÍCULA -->
    <div class="film-modal-overlay" id="filmModalOverlay" aria-hidden="true">
        <div class="film-modal" role="dialog" aria-modal="true" aria-labelledby="filmModalTitle">
            <button class="film-modal-close" id="filmModalClose" aria-label="Cerrar">✕</button>

            <div class="film-modal-body">
                <div class="film-modal-poster" id="filmModalPoster"></div>

                <div class="film-modal-info">
                    <div class="film-modal-title" id="filmModalTitle"></div>
                    <div class="film-modal-sub" id="filmModalSub"></div>
                    <div class="film-modal-tags" id="filmModalTags"></div>
                    <div class="film-modal-cast" id="filmModalCast"></div>
                    <p class="film-modal-desc" id="filmModalDesc"></p>

                    <div class="film-modal-rating">
                        <span class="film-modal-section-label">TU VALORACIÓN HOMIE</span>
                        <div class="star-rating" id="filmModalStars" role="group"
                            aria-label="Valoración de 1 a 5 estrellas">
                            <button class="star-btn" data-value="1" aria-label="1 estrella"><i
                                    class="bi bi-star"></i></button>
                            <button class="star-btn" data-value="2" aria-label="2 estrellas"><i
                                    class="bi bi-star"></i></button>
                            <button class="star-btn" data-value="3" aria-label="3 estrellas"><i
                                    class="bi bi-star"></i></button>
                            <button class="star-btn" data-value="4" aria-label="4 estrellas"><i
                                    class="bi bi-star"></i></button>
                            <button class="star-btn" data-value="5" aria-label="5 estrellas"><i
                                    class="bi bi-star"></i></button>
                        </div>
                    </div>

                    <div class="film-modal-lists">
                        <span class="film-modal-section-label">Agregar a lista</span>

                        <div class="add-to-list-wrap">
                            <button type="button" class="add-to-list-btn" id="addToListBtn" aria-expanded="false"
                                aria-label="Agregar a lista">
                                <i class="bi bi-plus-lg"></i>
                            </button>

                            <div class="add-to-list-dropdown" id="addToListDropdown" aria-hidden="true">
                                <button type="button" class="list-option" data-list="top5">
                                    <img src="../img/TOP5LIST(noglow).webp" width="40px" alt="Top 5">
                                    <span>Top 5</span>
                                    <i class="bi bi-check2 list-check" id="check-top5"></i>
                                </button>

                                <button type="button" class="list-option" data-list="watchlist">
                                    <img src="../img/WATCHLIST(noglow).webp" width="40px" alt="Watchlist">
                                    <span>Watchlist</span>
                                    <i class="bi bi-check2 list-check" id="check-watchlist"></i>
                                </button>

                                <button type="button" class="list-option" data-list="porver">
                                    <img src="../img/PENDINGLIST(noglow).webp" width="40px" alt="Por ver">
                                    <span>Por ver</span>
                                    <i class="bi bi-check2 list-check" id="check-porver"></i>
                                </button>
                            </div>
                        </div>

                        <div class="list-badges" id="listBadges"></div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV MOBILE -->
    <nav class="bottom-nav" aria-label="Navegación móvil">
        <div class="inner">
            <button class="bottom-nav-btn">
                <span><img src="../img/trending.webp" alt="Trending" width="50px"></span>
                <span class="bottom-nav-label">Trending</span>
            </button>

            <button class="bottom-nav-btn" onclick="window.location.href='./home.html'">
                <span><img src="../img/myhomies.webp" alt="Mis Homies" width="70px"></span>
                <span class="bottom-nav-label">Mis Homies</span>
            </button>

            <button class="bottom-nav-btn">
                <span><img src="../img/clapperboard.webp" alt="Estrenos" width="40px"></span>
                <span class="bottom-nav-label">Estrenos</span>
            </button>

            <button class="bottom-nav-btn" onclick="window.location.href='./profile.html'">
                <span><img src="../img/home_profileicon(noglow).webp" alt="Perfil" width="40px"></span>
                <span class="bottom-nav-label">Perfil</span>
            </button>
        </div>
    </nav>

    <!-- SockJS y Stomp -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script type="module" src="../src/JS/components/navbarComponent.js"></script>
    <script type="module" src="../src/JS/navbarSearch.js"></script>
    <script type="module" src="../src/JS/components/navbarNotifications.js"></script>
    <script type="module" src="../src/JS/script.js"></script>
    <script type="module" src="../src/JS/webSocket.js"></script>

    <script>
        document.addEventListener("nuevaCalificacion", function (e) {
            const calificacion = e.detail;
            console.log("Nueva calificación en tiempo real:", calificacion);
        });
    </script>

</body>

</html>
