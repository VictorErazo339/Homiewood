<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet" />

    <title>HOMIEWOOD</title>

    <!-- Apply the saved/preferred theme before first paint to avoid a flash.
         Kept in sync afterwards by src/context/ThemeContext.jsx. -->
    <script type="text/javascript">
        (function () {
            try {
                var t = localStorage.getItem("homiewood-theme");
                if (t !== "light" && t !== "dark") {
                    t = window.matchMedia("(prefers-color-scheme: light)").matches
                        ? "light"
                        : "dark";
                }
                document.documentElement.setAttribute("data-theme", t);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>

    <!-- Restores the deep-link path encoded by 404.html (SPA on GitHub Pages). -->
    <script type="text/javascript">
        (function (l) {
            if (l.search[1] === "/") {
                var decoded = l.search
                    .slice(1)
                    .split("&")
                    .map(function (s) {
                        return s.replace(/~and~/g, "&");
                    })
                    .join("?");
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
        })(window.location);
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
